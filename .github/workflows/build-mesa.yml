name: Build Mesa drivers (Zink + OpenGL)

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa git tag/branch to build (e.g. mesa-24.2.8 or main)'
        required: true
        default: 'mesa-24.2.8'

jobs:
  build-zink:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build python3-mako python3-yaml \
            bison flex pkg-config zstd \
            libdrm-dev libx11-dev libxext-dev libxcb1-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr-dev \
            libxshmfence-dev libexpat1-dev libxrandr-dev \
            libwayland-dev wayland-protocols git

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.mesa_ref }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-src

      - name: Configure (Zink, glx=xlib, no dri3)
        working-directory: mesa-src
        run: |
          meson setup build \
            -Dstrip=true \
            -Dplatforms=x11 \
            -Dgallium-va=disabled \
            -Ddri-drivers= \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dgallium-drivers=zink \
            -Ddri3=disabled \
            -Dvulkan-drivers= \
            -Dglx=xlib \
            -Dlmsensors=disabled \
            -Dprefix=/data/data/com.winlator/files/rootfs/usr \
            -Dbuildtype=release

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)"

      - name: Package into winlator .tzst layout
        run: |
          mkdir -p stage/usr/lib
          find mesa-src/build -iname "libGL.so*" -print
          cp mesa-src/build/src/gallium/targets/xlib/libGL.so.1.7.0 stage/usr/lib/libGL.so.1.7.0 \
            || cp "$(find mesa-src/build -iname 'libGL.so.1.7.0' | head -1)" stage/usr/lib/libGL.so.1.7.0
          cd stage
          tar -cf - -C . . | zstd -19 -o ../zink-custom.tzst
          cd ..
          ls -la zink-custom.tzst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zink-custom-tzst
          path: zink-custom.tzst

  build-opengl:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build python3-mako python3-yaml \
            bison flex pkg-config zstd \
            libdrm-dev libx11-dev libxext-dev libxcb1-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr-dev \
            libxshmfence-dev libexpat1-dev libxrandr-dev \
            libwayland-dev wayland-protocols git

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.mesa_ref }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-src

      - name: Configure (native Freedreno OpenGL, kgsl, glx=xlib, no dri3)
        working-directory: mesa-src
        run: |
          meson setup build \
            -Dstrip=true \
            -Dplatforms=x11 \
            -Dgallium-va=disabled \
            -Ddri-drivers= \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dgallium-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Ddri3=disabled \
            -Dvulkan-drivers= \
            -Dglx=xlib \
            -Dlmsensors=disabled \
            -Dprefix=/data/data/com.winlator/files/rootfs/usr \
            -Dbuildtype=release

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)"

      - name: Package into winlator .tzst layout
        run: |
          mkdir -p stage/usr/lib
          cp "$(find mesa-src/build -iname 'libGL.so.1.7.0' | head -1)" stage/usr/lib/libGL.so.1.7.0
          cd stage
          tar -cf - -C . . | zstd -19 -o ../opengl-1.0.tzst
          cd ..
          ls -la opengl-1.0.tzst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengl-freedreno-tzst
          path: opengl-1.0.tzst
