name: Build Mesa drivers (Zink + Freedreno KGSL)

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa tag/branch (e.g. mesa-26.2.0 or main)'
        required: true
        default: 'mesa-26.2.0'
      runner:
        description: 'ARM runner (22.04 = older glibc = safer for rootfs)'
        required: true
        type: choice
        default: 'ubuntu-22.04-arm'
        options:
          - ubuntu-22.04-arm
          - ubuntu-24.04-arm

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: zink
            drivers: zink
          - name: opengl
            drivers: freedreno

    env:
      MESA_REF: ${{ inputs.mesa_ref }}
      NAME: ${{ matrix.name }}
      DRIVERS: ${{ matrix.drivers }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config bison flex zstd zip \
            python3 python3-venv python3-pip \
            libdrm-dev libexpat1-dev zlib1g-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxxf86vm-dev libxrandr-dev libxshmfence-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev \
            libwayland-dev wayland-protocols

      - name: Install meson and python modules (venv)
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --upgrade pip
          "$HOME/venv/bin/pip" install meson ninja mako pyyaml packaging pycparser ply
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Clone Mesa
        run: |
          git ls-remote --exit-code --heads --tags \
            https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_REF" \
            || { echo "::error::Ref '$MESA_REF' not found in Mesa repo"; exit 1; }
          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-src

      - name: Configure
        working-directory: mesa-src
        run: |
          meson --version
          # Collect the option names this Mesa version really has, so renamed or
          # removed options (gles1, dri3, freedreno-kgsl ...) never break configure.
          F=$(ls meson.options meson_options.txt 2>/dev/null | head -n1)
          python3 - "$F" > /tmp/opts.txt <<'PY'
          import re, sys
          print("\n".join(re.findall(r"option\(\s*['\"]([^'\"]+)['\"]", open(sys.argv[1]).read())))
          PY
          ARGS=()
          add() {
            if grep -qx -- "$1" /tmp/opts.txt; then ARGS+=("-D$1=$2")
            else echo "::notice::option '$1' not in this Mesa, skipped"; fi
          }
          add platforms x11
          add gallium-drivers "$DRIVERS"
          add vulkan-drivers ""
          add llvm disabled
          add gallium-va disabled
          add gallium-vdpau disabled
          add gallium-xa disabled
          add video-codecs ""
          add shared-glapi enabled
          add glx dri
          add egl enabled
          add gbm enabled
          add gles1 disabled
          add gles2 enabled
          add dri3 enabled
          add lmsensors disabled
          add libunwind disabled
          add valgrind disabled
          add zstd disabled
          if [ "$NAME" = "opengl" ]; then
            add freedreno-kmds kgsl
            add freedreno-kgsl true
          fi
          echo "Options: ${ARGS[*]}"
          meson setup build \
            --buildtype=release -Dstrip=true \
            -Dprefix=/usr -Dlibdir=lib \
            "${ARGS[@]}"

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)"

      - name: Install to stage
        run: |
          rm -rf stage
          DESTDIR="$PWD/stage" ninja -C mesa-src/build install
          rm -rf stage/usr/include stage/usr/lib/pkgconfig
          echo "===== Installed files ====="
          find stage \( -type f -o -type l \) | sort

      - name: Package
        run: |
          VER="${MESA_REF#mesa-}"
          mkdir -p out
          # 1) rootfs package (extracted into rootfs/, gives usr/lib/...)
          tar --owner=0 --group=0 --numeric-owner -C stage -cf - . \
            | zstd -19 -T0 -o "out/${NAME}-${VER}.tzst"
          # 2) folder for NATIVE_MESA_SRC (needs lib/ and dri/; symlinks resolved)
          rm -rf native && mkdir -p native
          cp -aL stage/usr/lib native/lib
          cp -aL stage/usr/lib/dri native/dri
          [ -d stage/usr/share ] && cp -a stage/usr/share native/share || true
          (cd native && zip -qr "../out/mesa-native-${NAME}-${VER}.zip" .)
          ls -lh out

      - name: Dependency report
        run: |
          {
            echo "## ${NAME} (${MESA_REF})"
            echo '```'
            for f in $(find stage -type f -name '*.so*'); do
              echo "--- $f"
              readelf -d "$f" | grep NEEDED || true
              objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1 || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > out/deps-${NAME}.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-package
          path: out/*
          if-no-files-found: error
