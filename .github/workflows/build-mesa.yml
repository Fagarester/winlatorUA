name: Build Mesa drivers (Zink + OpenGL)

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa git tag/branch to build (e.g. mesa-24.2.8 or main)'
        required: true
        default: 'mesa-24.2.8'

jobs:

  # ============================================================
  # ZINK
  # ============================================================
  build-zink:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            meson \
            ninja-build \
            python3-mako \
            python3-yaml \
            bison \
            flex \
            pkg-config \
            zstd \
            git \
            libdrm-dev \
            libexpat1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libxcb1-dev \
            libxcb-glx0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            wayland-protocols

      - name: Clone Mesa
        run: |
          git clone \
            --depth 1 \
            --branch "${{ github.event.inputs.mesa_ref }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa-src

      - name: Configure Zink
        working-directory: mesa-src
        run: |
          meson setup build \
            -Dstrip=true \
            -Dplatforms=x11 \
            -Dgallium-va=disabled \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=zink \
            -Dvulkan-drivers= \
            -Dglx=dri \
            -Degl=enabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dgbm=enabled \
            -Ddri3=enabled \
            -Dlmsensors=disabled \
            -Dprefix=/usr \
            -Dlibdir=lib \
            -Dbuildtype=release

      - name: Build Zink
        working-directory: mesa-src
        run: |
          ninja -C build -j"$(nproc)"

      - name: Install Zink
        working-directory: mesa-src
        run: |
          rm -rf "$GITHUB_WORKSPACE/stage"
          mkdir -p "$GITHUB_WORKSPACE/stage"

          DESTDIR="$GITHUB_WORKSPACE/stage" \
            ninja -C build install

          echo "===== Installed Zink files ====="

          find "$GITHUB_WORKSPACE/stage" \
            \( -type f -o -type l \) \
            -print | sort

      - name: Create Zink package
        run: |
          cd "$GITHUB_WORKSPACE/stage"

          tar -cf - . | \
            zstd -19 -T0 \
            -o "$GITHUB_WORKSPACE/zink-custom.tzst"

          echo "===== Zink package ====="
          ls -lh "$GITHUB_WORKSPACE/zink-custom.tzst"

      - name: Upload Zink artifact
        uses: actions/upload-artifact@v4
        with:
          name: zink-custom-tzst
          path: zink-custom.tzst


  # ============================================================
  # FREEDRENO OPENGL / KGSL
  # ============================================================
  build-opengl:
    runs-on: ubuntu-24.04-arm

    steps:

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            meson \
            ninja-build \
            python3-mako \
            python3-yaml \
            bison \
            flex \
            pkg-config \
            zstd \
            git \
            libdrm-dev \
            libexpat1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libxcb1-dev \
            libxcb-glx0-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            wayland-protocols

      - name: Clone Mesa
        run: |
          git clone \
            --depth 1 \
            --branch "${{ github.event.inputs.mesa_ref }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git \
            mesa-src

      - name: Configure Freedreno OpenGL
        working-directory: mesa-src
        run: |
          meson setup build \
            -Dstrip=true \
            -Dplatforms=x11 \
            -Dgallium-va=disabled \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dshared-glapi=enabled \
            -Dgallium-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dvulkan-drivers= \
            -Dglx=dri \
            -Degl=enabled \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dgbm=enabled \
            -Ddri3=enabled \
            -Dlmsensors=disabled \
            -Dprefix=/usr \
            -Dlibdir=lib \
            -Dbuildtype=release

      - name: Build Freedreno
        working-directory: mesa-src
        run: |
          ninja -C build -j"$(nproc)"

      - name: Install Freedreno
        working-directory: mesa-src
        run: |
          rm -rf "$GITHUB_WORKSPACE/stage"
          mkdir -p "$GITHUB_WORKSPACE/stage"

          DESTDIR="$GITHUB_WORKSPACE/stage" \
            ninja -C build install

          echo "===== Installed Freedreno files ====="

          find "$GITHUB_WORKSPACE/stage" \
            \( -type f -o -type l \) \
            -print | sort

      - name: Create OpenGL package
        run: |
          cd "$GITHUB_WORKSPACE/stage"

          tar -cf - . | \
            zstd -19 -T0 \
            -o "$GITHUB_WORKSPACE/opengl-1.0.tzst"

          echo "===== OpenGL package ====="
          ls -lh "$GITHUB_WORKSPACE/opengl-1.0.tzst"

      - name: Upload OpenGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: opengl-freedreno-tzst
          path: opengl-1.0.tzst
