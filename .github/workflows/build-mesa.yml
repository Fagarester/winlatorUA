name: Build Mesa (Bruno flags) - Zink + Freedreno KGSL

# Flags taken from https://github.com/brunodev85/mesa3d-custom (README):
#   prefix = /data/data/com.winlator/files/rootfs/usr, Zink: glx=xlib, dri3=disabled, platforms=x11
# Bruno only ships Zink 22.2.5 (his own patched tree) and has NO freedreno OpenGL recipe.
# So here: new upstream Mesa + Bruno's flags, optionally + Bruno's Zink diff ported (experimental).

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa tag/branch (mesa-26.2.0, mesa-26.1.5, main ...)'
        required: true
        default: 'mesa-26.2.0'
      runner:
        description: 'ARM runner'
        required: true
        type: choice
        default: 'ubuntu-24.04-arm'
        options:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
      port_bruno_zink_patch:
        description: 'Try to apply Bruno zink-22.2.5 diff onto new Mesa (experimental, hunks may fail)'
        required: true
        type: boolean
        default: false

env:
  PFX: /data/data/com.winlator/files/rootfs/usr

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exactly Bruno's Zink flags (xlib GLX, no DRI3)
          - name: zink-xlib
            pkg: zink
            drivers: softpipe,zink
            glx: xlib
            dri3: disabled
          # Same, but DRI GLX + DRI3 (kopper path) - test if xlib variant misbehaves
          - name: zink-dri
            pkg: zink-dri
            drivers: zink
            glx: dri
            dri3: enabled
          # Direct OpenGL on Adreno via KGSL (Bruno has no recipe: experimental)
          - name: opengl-kgsl
            pkg: opengl
            drivers: freedreno
            glx: dri
            dri3: enabled

    env:
      MESA_REF: ${{ inputs.mesa_ref }}
      NAME: ${{ matrix.name }}
      PKG: ${{ matrix.pkg }}
      DRIVERS: ${{ matrix.drivers }}
      GLX: ${{ matrix.glx }}
      DRI3: ${{ matrix.dri3 }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config bison flex zstd zip patch \
            python3 python3-venv python3-pip \
            libdrm-dev libexpat1-dev zlib1g-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxxf86vm-dev libxrandr-dev libxshmfence-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev \
            libwayland-dev wayland-protocols

      - name: Install meson and python modules (venv)
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --upgrade pip
          "$HOME/venv/bin/pip" install meson ninja mako pyyaml packaging pycparser ply
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Clone Mesa
        run: |
          git ls-remote --exit-code --heads --tags \
            https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_REF" \
            || { echo "::error::Ref '$MESA_REF' not found in Mesa repo"; exit 1; }
          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-src

      - name: Make Bruno zink diff (22.2.5 vs his tree)
        if: startsWith(matrix.name, 'zink')
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/brunodev85/mesa3d-custom.git bruno
          git -C bruno sparse-checkout set zink-22.2.5
          git clone --depth 1 --branch mesa-22.2.5 \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-orig
          mkdir -p out
          cd bruno/zink-22.2.5
          : > "$GITHUB_WORKSPACE/out/bruno-zink-22.2.5.patch"
          find . -type f -not -path './.git/*' | sort | while read -r f; do
            f="${f#./}"; o="$GITHUB_WORKSPACE/mesa-orig/$f"
            if [ -f "$o" ]; then
              cmp -s "$o" "$f" || diff -u --label "a/$f" --label "b/$f" "$o" "$f" || true
            else
              diff -uN --label "a/$f" --label "b/$f" /dev/null "$f" || true
            fi
          done >> "$GITHUB_WORKSPACE/out/bruno-zink-22.2.5.patch"
          cd "$GITHUB_WORKSPACE"
          echo "Changed files in Bruno's Zink tree:"
          grep '^+++ ' out/bruno-zink-22.2.5.patch | sed 's/\t.*//' | tee changed.txt
          echo "### Bruno zink diff: $(wc -l < changed.txt) files changed" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; head -50 changed.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          cd mesa-src
          if patch -p1 --dry-run -s < ../out/bruno-zink-22.2.5.patch >/tmp/dry.txt 2>&1; then
            echo "Bruno diff applies cleanly on $MESA_REF" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Bruno 22.2.5 diff does NOT apply cleanly on $MESA_REF (expected, 4 years of drift)"
            head -40 /tmp/dry.txt
            echo "Bruno diff does NOT apply cleanly on $MESA_REF (see artifact, port by hand)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply Bruno diff (only if requested)
        if: startsWith(matrix.name, 'zink') && inputs.port_bruno_zink_patch
        continue-on-error: true
        working-directory: mesa-src
        run: |
          patch -p1 --forward --no-backup-if-mismatch < ../out/bruno-zink-22.2.5.patch || true
          echo "Rejected hunks:"; find . -name '*.rej' | tee /tmp/rej.txt
          [ ! -s /tmp/rej.txt ] || echo "::warning::Some hunks were rejected; result may not compile"

      - name: Configure
        working-directory: mesa-src
        run: |
          meson --version
          F=$(ls meson.options meson_options.txt 2>/dev/null | head -n1)
          python3 - "$F" > /tmp/opts.txt <<'PY'
          import re, sys
          print("\n".join(re.findall(r"option\(\s*['\"]([^'\"]+)['\"]", open(sys.argv[1]).read())))
          PY
          ARGS=()
          add() {
            if grep -qx -- "$1" /tmp/opts.txt; then ARGS+=("-D$1=$2")
            else echo "::notice::option '$1' not in this Mesa, skipped"; fi
          }
          GLXVAL="$GLX"
          if [ "$GLX" = "xlib" ] && ! grep -q "'xlib'" "$F" && grep -q "gallium-xlib" "$F"; then
            GLXVAL="gallium-xlib"; echo "::notice::glx=xlib renamed to gallium-xlib in this Mesa"
          fi
          add platforms x11
          add gallium-drivers "$DRIVERS"
          add vulkan-drivers ""
          add dri-drivers ""
          add llvm disabled
          add gallium-va disabled
          add lmsensors disabled
          add libunwind disabled
          add valgrind disabled
          add glx "$GLXVAL"
          add dri3 "$DRI3"
          if [ "$NAME" = "opengl-kgsl" ]; then
            add freedreno-kmds kgsl
            add freedreno-kgsl true
          fi
          echo "Options: ${ARGS[*]}"
          setup() {
            meson setup build --buildtype=release -Dstrip=true \
              -Dprefix="$PFX" -Dlibdir=lib "$@"
          }
          if ! setup "${ARGS[@]}"; then
            echo "::warning::configure failed, last meson log:"; tail -40 build/meson-logs/meson-log.txt || true
            if [ "$GLX" = "xlib" ]; then
              echo "::warning::retrying xlib variant with softpipe+zink"
              rm -rf build
              ARGS=("${ARGS[@]/-Dgallium-drivers=zink/-Dgallium-drivers=softpipe,zink}")
              setup "${ARGS[@]}"
            else exit 1; fi
          fi

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)"

      - name: Install to stage
        run: |
          rm -rf stage
          DESTDIR="$PWD/stage" ninja -C mesa-src/build install
          ROOT="stage${PFX%/usr}"
          rm -rf "$ROOT/usr/include" "$ROOT/usr/lib/pkgconfig"
          echo "===== Installed files ====="
          find "$ROOT" \( -type f -o -type l \) | sort

      - name: Bundle X/xcb libs that rootfs may lack (libxcb-glx etc.)
        run: |
          ROOT="stage${PFX%/usr}"; DST="$ROOT/usr/lib"
          NEED=$(for f in $(find "$ROOT" -type f -name '*.so*'); do
                   readelf -d "$f" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p'
                 done | sort -u)
          echo "NEEDED by our libs:"; echo "$NEED"
          for n in $NEED; do
            case "$n" in
              libxcb-*|libX11-xcb*|libxshmfence*|libXxf86vm*|libXdamage*|libXfixes*|libXrandr*|libXrender*) ;;
              *) continue ;;
            esac
            [ -e "$DST/$n" ] && continue
            src=$(ldconfig -p | awk -v n="$n" '$1==n{print $NF; exit}')
            if [ -n "$src" ]; then cp -L "$src" "$DST/$n"; echo "bundled $n"
            else echo "::warning::$n not found on runner"; fi
          done

      - name: Package
        run: |
          VER="${MESA_REF#mesa-}"
          ROOT="stage${PFX%/usr}"
          mkdir -p out
          # rootfs package: extracts to usr/lib/... inside rootfs (drop into assets/graphics_driver)
          tar --owner=0 --group=0 --numeric-owner -C "$ROOT" -cf - usr \
            | zstd -19 -T0 -o "out/${PKG}-${VER}.tzst"
          # NATIVE_MESA_SRC folder (lib/ + dri/)
          rm -rf native && mkdir -p native
          cp -aL "$ROOT/usr/lib" native/lib
          [ -d "$ROOT/usr/lib/dri" ] && cp -aL "$ROOT/usr/lib/dri" native/dri || true
          (cd native && zip -qr "../out/mesa-native-${NAME}-${VER}.zip" .)
          ls -lh out

      - name: Dependency report
        run: |
          ROOT="stage${PFX%/usr}"
          {
            echo "## ${NAME} (${MESA_REF})"
            echo '```'
            for f in $(find "$ROOT" -type f -name '*.so*'); do
              echo "--- ${f#$ROOT}"
              readelf -d "$f" | grep NEEDED || true
              objdump -T "$f" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1 || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > "out/deps-${NAME}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error
