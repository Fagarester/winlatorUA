name: Build Zink xlib (Bruno/Grima04 recipe, new Mesa)

# Recipe = Winlator's Zink: Mesa gallium-xlib with Zink inside ONE libGL.so
#   meson: -Dgallium-drivers=zink,softpipe -Ddri3=false -Dglx=gallium-xlib -Dplatforms=x11
#          -Dvulkan-drivers= -Dllvm=disabled  prefix=/data/data/com.winlator/files/rootfs/usr
# The package contains ONLY libGL.so* (+ a few X libs if libGL needs them),
# so it cannot overwrite libEGL/libgbm/libglapi in rootfs (that is what broke the old Zink).

on:
  workflow_dispatch:
    inputs:
      mesa_ref:
        description: 'Mesa tag (mesa-26.2.0, mesa-26.1.5 ...)'
        required: true
        default: 'mesa-26.2.0'
      runner:
        description: 'ARM runner'
        required: true
        type: choice
        default: 'ubuntu-24.04-arm'
        options:
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm

env:
  PFX: /data/data/com.winlator/files/rootfs/usr

jobs:
  build:
    name: zink-xlib
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      MESA_REF: ${{ inputs.mesa_ref }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git pkg-config bison flex zstd zip patch \
            python3 python3-venv python3-pip \
            libdrm-dev libexpat1-dev zlib1g-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev \
            libxdamage-dev libxxf86vm-dev libxrandr-dev libxshmfence-dev \
            libxcb1-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev

      - name: Install meson and python modules (venv)
        run: |
          python3 -m venv "$HOME/venv"
          "$HOME/venv/bin/pip" install --upgrade pip
          "$HOME/venv/bin/pip" install meson ninja mako pyyaml packaging pycparser ply
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Clone Mesa
        run: |
          git ls-remote --exit-code --heads --tags \
            https://gitlab.freedesktop.org/mesa/mesa.git "$MESA_REF" \
            || { echo "::error::Ref '$MESA_REF' not found"; exit 1; }
          git clone --depth 1 --branch "$MESA_REF" \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-src

      - name: Force Zink into xlib libGL (what Grima04/Bruno patches do)
        working-directory: mesa-src
        run: |
          M=src/gallium/targets/libgl-xlib/meson.build
          echo "===== original $M ====="; cat "$M"
          echo "===== where zink is mentioned in xlib/sw code ====="
          grep -rn -i "zink" src/gallium/targets/libgl-xlib src/gallium/auxiliary/target-helpers/sw_helper.h || true
          if grep -q "driver_zink" "$M"; then
            echo "driver_zink already linked into libgl-xlib"
          elif grep -q "driver_swrast" "$M"; then
            sed -i '0,/driver_swrast/s//driver_swrast, driver_zink/' "$M"
            echo "===== patched ====="; git diff -- "$M"
          else
            echo "::error::cannot find driver_swrast in $M, need manual patch (see log above)"; exit 1
          fi

      - name: Configure
        working-directory: mesa-src
        run: |
          F=$(ls meson.options meson_options.txt 2>/dev/null | head -n1)
          python3 - "$F" > /tmp/opts.txt <<'PY'
          import re, sys
          print("\n".join(re.findall(r"option\(\s*['\"]([^'\"]+)['\"]", open(sys.argv[1]).read())))
          PY
          ARGS=()
          add() {
            if grep -qx -- "$1" /tmp/opts.txt; then ARGS+=("-D$1=$2")
            else echo "::notice::option '$1' not in this Mesa, skipped"; fi
          }
          GLXVAL=xlib
          if ! grep -q "'xlib'" "$F" && grep -q "gallium-xlib" "$F"; then GLXVAL=gallium-xlib; fi
          add platforms x11
          add gallium-drivers softpipe,zink
          add vulkan-drivers ""
          add dri-drivers ""
          add llvm disabled
          add gallium-va disabled
          add lmsensors disabled
          add libunwind disabled
          add valgrind disabled
          add egl disabled
          add gbm disabled
          add gles1 disabled
          add gles2 disabled
          add glx "$GLXVAL"
          add dri3 disabled
          echo "Options: ${ARGS[*]}"
          meson setup build --buildtype=release -Dstrip=true \
            -Dprefix="$PFX" -Dlibdir=lib "${ARGS[@]}" \
            || { tail -60 build/meson-logs/meson-log.txt; exit 1; }

      - name: Build
        working-directory: mesa-src
        run: ninja -C build -j"$(nproc)"

      - name: Install to stage and keep only libGL
        run: |
          rm -rf stage
          DESTDIR="$PWD/stage" ninja -C mesa-src/build install
          ROOT="stage${PFX%/usr}"; LIB="$ROOT/usr/lib"
          echo "===== everything Mesa installed ====="
          find "$ROOT" \( -type f -o -type l \) | sort
          # keep only libGL*, drop all the rest
          find "$LIB" -mindepth 1 -maxdepth 1 ! -name 'libGL.so*' -exec rm -rf {} +
          rm -rf "$ROOT/usr/share" "$ROOT/usr/include" "$ROOT/usr/bin"
          [ -e "$LIB/libGL.so.1" ] || { echo "::error::libGL.so.1 was not built"; exit 1; }
          ls -la "$LIB"

      - name: Check that Zink is really inside libGL
        run: |
          LIB="stage${PFX%/usr}/usr/lib"
          L=$(readlink -f "$LIB/libGL.so.1")
          N=$(strings "$L" | grep -c "ZINK_DEBUG" || true)
          echo "ZINK_DEBUG strings in libGL: $N"
          [ "$N" -gt 0 ] || { echo "::error::No Zink inside libGL (only software renderer)"; exit 1; }

      - name: Bundle X libs that libGL needs and rootfs may lack
        run: |
          ROOT="stage${PFX%/usr}"; DST="$ROOT/usr/lib"
          NEED=$(readelf -d "$(readlink -f "$DST/libGL.so.1")" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')
          echo "libGL NEEDED:"; echo "$NEED"
          for n in $NEED; do
            case "$n" in
              libxcb-*|libX11-xcb*|libxshmfence*|libXxf86vm*|libXdamage*|libXfixes*|libXrandr*|libXrender*) ;;
              *) continue ;;
            esac
            src=$(ldconfig -p | awk -v n="$n" '$1==n{print $NF; exit}')
            if [ -n "$src" ]; then cp -L "$src" "$DST/$n"; echo "bundled $n"
            else echo "::warning::$n not found on runner"; fi
          done

      - name: Package
        run: |
          VER="${MESA_REF#mesa-}"
          ROOT="stage${PFX%/usr}"
          mkdir -p out
          tar --owner=0 --group=0 --numeric-owner -C "$ROOT" -cf - usr \
            | zstd -19 -T0 -o "out/zink-${VER}.tzst"
          tar -C "$ROOT" -tf <(zstd -dc "out/zink-${VER}.tzst") | tee out/contents.txt
          {
            echo "## libGL NEEDED / GLIBC"
            L=$(readlink -f "$ROOT/usr/lib/libGL.so.1")
            readelf -d "$L" | grep NEEDED
            objdump -T "$L" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1
          } | tee out/deps.txt "$GITHUB_STEP_SUMMARY"
          ls -lh out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zink-xlib
          path: out/*
          if-no-files-found: error
