name: Bruno zink diff (no build)

on:
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone Bruno tree and original Mesa 22.2.5
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/brunodev85/mesa3d-custom.git bruno
          git -C bruno sparse-checkout set zink-22.2.5
          git clone --depth 1 --branch mesa-22.2.5 \
            https://gitlab.freedesktop.org/mesa/mesa.git mesa-orig
          ls bruno/zink-22.2.5 | head -30

      - name: Make diff
        run: |
          mkdir -p out
          cd bruno/zink-22.2.5
          : > "$GITHUB_WORKSPACE/out/bruno-zink-22.2.5.patch"
          find . -type f -not -path './.git/*' | sort | while read -r f; do
            f="${f#./}"; o="$GITHUB_WORKSPACE/mesa-orig/$f"
            if [ -f "$o" ]; then
              cmp -s "$o" "$f" || diff -u --label "a/$f" --label "b/$f" "$o" "$f" || true
            else
              diff -uN --label "a/$f" --label "b/$f" /dev/null "$f" || true
            fi
          done >> "$GITHUB_WORKSPACE/out/bruno-zink-22.2.5.patch"
          cd "$GITHUB_WORKSPACE"
          grep '^+++ ' out/bruno-zink-22.2.5.patch | sed 's/\t.*//' > out/changed-files.txt
          wc -l out/changed-files.txt out/bruno-zink-22.2.5.patch
          { echo "### Changed files"; echo '```'; cat out/changed-files.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bruno-zink-diff
          path: out/*
          if-no-files-found: error
